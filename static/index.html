<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Agent</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Main contentk for UI page. -->
    <main class="main-content">
        <h1>Your Web Application</h1>
        <p>This is the main content of your website. The chatbot will appear on top of this.</p>
    </main>

    <!-- Chatbot Icon -->
    <div id="chatbot-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="32px" height="32px">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 12H5v-2h14v2zm0-3H5V9h14v2zm0-3H5V6h14v2z"/>
        </svg>
    </div>

    <!-- Chatbot Popup -->
    <div id="chatbot-popup" class="hidden">
        <div id="chat-container">
            <div id="chat-header" role="toolbar">
                <div class="header-left">
                    <h2>Flight Assistant</h2>
                </div>
                <div class="header-controls">
                    <button id="size-presets" title="Size presets">▤</button>
                    <button id="toggle-maximize" title="Maximize / Restore">⬜</button>
                    <button id="close-chatbot" aria-label="Close">✕</button>
                </div>
            </div>
            <div id="chat-messages">
                <!-- Chat messages be appended here -->
            </div>
            <div id="chat-input-area">
                <!-- File attachment Holder -->
                <div id="attachment-container">
                    <input type="file" id="imageUploader" accept="image/*" style="display: none;">
                    <button id="attach-button" title="Attach Image">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24px" height="24px">
                            <path d="M12.7,19.2c-1.6,1.6-4.1,1.6-5.7,0c-1.6-1.6-1.6-4.1,0-5.7l6.4-6.4c0.8-0.8,2.1-0.8,2.8,0c0.8,0.8,0.8,2.1,0,2.8L10,16.1c-0.4,0.4-1,0.4-1.4,0c-0.4-0.4-0.4-1,0-1.4l5.7-5.7l-1.4-1.4l-5.7,5.7c-1.2,1.2-1.2,3.1,0,4.2c1.2,1.2,3.1,1.2,4.2,0L22,10.4c2.3-2.3,2.3-6.1,0-8.5c-2.3-2.3-6.1-2.3-8.5,0l-9.9,9.9c-3.1,3.1-3.1,8.2,0,11.3c3.1,3.1,8.2,3.1,11.3,0l6.4-6.4l-1.4-1.4L12.7,19.2z"/>
                        </svg>
                    </button>
                    <span id="file-name">No file chosen</span>
                </div>
                <!-- Company name input holder -->
                <div id="company-input-container" class="hidden">
                    <input type="text" id="company-name-input" placeholder="Enter Company Name and press Send">
                </div>
                <!-- Send button -->
                <button id="send-button" title="Send">➤</button>
            </div>
            <div id="resizer" title="Drag to resize" aria-hidden="true"></div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
